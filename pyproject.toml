[project]
name = "rozi"
version = "1.0.0"
description = "Rozi: multilingual GenAI work companion for gig and informal workers in India"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["gig_companion"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PL", "C4", "PT", "RET", "ARG"]
ignore = [
  "PLR0913",  # FastAPI handlers take several injected dependencies
  "PLR2004",  # HTTP status codes in comparisons are clearer inline
  "RUF001",   # Indic text and ₹ in strings are intentional
  "RUF002",
  "RUF003",
  "B008",     # FastAPI Depends/File/Form defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "ARG001"]
"tools/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
exclude = ["gig_companion/"]

[[tool.mypy.overrides]]
module = ["app.domain.*", "app.ai.*", "app.selfheal.*"]
strict = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app", "tools"]
branch = true

[tool.coverage.report]
skip_empty = true
show_missing = true
